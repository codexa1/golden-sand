<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>KEMET Admin</title>
<style>body{font:15px/1.5 system-ui,sans-serif;background:#f6efe1;padding:16px;max-width:900px;margin:auto}fieldset{background:#fffaf0;border:1px solid #d9c79a;border-radius:14px;margin:14px 0;padding:14px}label{display:block;font-weight:600;font-size:.8rem;margin:8px 0 2px}input,textarea{width:100%;padding:9px;border:1px solid #cdb98c;border-radius:8px;font:inherit}button{background:#c9983f;border:0;border-radius:30px;padding:11px 22px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}.d{background:#b3261e;color:#fff}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><div id="a"></div>
<script src="data.js"></script><script>
const D=DATA,esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
if(prompt('Passcode')!==D.pass){document.body.innerHTML='';}else r();
function get(p){return p.split('.').reduce((o,k)=>o[k],D)}
function set(p,v){const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],D)[l]=v}
const f=(l,p,t)=>t=='c'?`<label><input type="checkbox" ${get(p)?'checked':''} onchange="set('${p}',this.checked)" style="width:auto"> ${l}</label>`:t=='l'?`<label>${l} (one per line)</label><textarea rows="4" onchange="set('${p}',this.value.split('\\n').filter(Boolean))">${esc((get(p)||[]).join('\n'))}</textarea>`:`<label>${l}</label><input ${t=='n'?'type="number"':''} value="${esc(get(p))}" onchange="set('${p}',${t=='n'?'+this.value':'this.value'})">`;
function r(){let h=`<h1>KEMET Admin</h1><fieldset><b>Site</b><div class="g">${f('Brand','brand')}${f('WhatsApp (country code, no +)','wa')}${f('Phone text','phone')}${f('Admin passcode','pass')}</div></fieldset><h2>Tours</h2>`;
D.tours.forEach((t,i)=>{const p='tours.'+i+'.';h+=`<fieldset><b>${esc(t.title.en)}</b><div class="g">${f('ID (no spaces; image = images/ID.jpg)',p+'id')}${f('Price ($)',p+'price','n')}${f('Title EN',p+'title.en')}${f('Title AR',p+'title.ar')}${f('Duration',p+'dur')}${f('Category (pyr / city / coast)',p+'cat')}${f('Image path (optional)',p+'img')}</div>${f('Description EN',p+'desc.en')}${f('Description AR',p+'desc.ar')}${f('Highlights EN',p+'hl.en','l')}${f('Highlights AR',p+'hl.ar','l')}${f('Visible on site',p+'on','c')}<button class="d" onclick="D.tours.splice(${i},1);r()">Delete</button></fieldset>`});
h+=`<button onclick="D.tours.push({id:'new'+Date.now(),cat:'city',art:D.tours.length%7,on:true,price:50,dur:'6 h',img:'',title:{en:'New tour',ar:'رحلة جديدة'},desc:{en:'',ar:''},hl:{en:[],ar:[]}});r()">+ Add tour</button><h2>Add-ons</h2>`;
D.addons.forEach((a,i)=>{const p='addons.'+i+'.';h+=`<fieldset><div class="g">${f('Name EN',p+'name.en')}${f('Name AR',p+'name.ar')}${f('Price ($)',p+'price','n')}</div>${f('Only for categories (pyr / city / coast; empty = all tours)',p+'cats','l')}${f('Visible',p+'on','c')}<button class="d" onclick="D.addons.splice(${i},1);r()">Delete</button></fieldset>`});
h+=`<button onclick="D.addons.push({id:'a'+Date.now(),price:10,on:true,name:{en:'New add-on',ar:'إضافة جديدة'}});r()">+ Add add-on</button><hr><button onclick="dl()">⬇ Download data.js</button><p>Replace data.js in your project with the downloaded file, then re-upload the site.</p>`;
document.getElementById('a').innerHTML=h}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['window.DATA='+JSON.stringify(D,null,1)+';'],{type:'text/javascript'}));a.download='data.js';a.click()}
</script></body></html>
